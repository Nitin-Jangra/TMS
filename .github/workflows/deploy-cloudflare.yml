# Optional CI/CD: deploy FC-CMS to Cloudflare Workers on every push to main.
# Requires two GitHub repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with "Workers Scripts:Edit", "D1:Edit", "Account Settings:Read"
#                           (created at dash.cloudflare.com → My Profile → API Tokens)
#   CLOUDFLARE_ACCOUNT_ID — your account id (dashboard → Workers & Pages → Overview, right sidebar)
#
# Prefer the simpler dashboard route? Connect the repo in Workers & Pages → Create →
# Workers → Connect to Git instead (docs/deploy-cloudflare.md, Part 7) and delete this file.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply D1 schema + seed data (idempotent)
        run: |
          npx wrangler d1 execute fitclass --remote --file=cloudflare/d1/0001_schema.sql || true
          npx wrangler d1 execute fitclass --remote --file=cloudflare/d1/0003_reset_data.sql
          npx wrangler d1 execute fitclass --remote --file=cloudflare/d1/0002_seed_data.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: file:./db/custom.db # build-time only; runtime uses the D1 binding
